name: Fetch Taskmarket data

on:
  schedule:
    - cron: "7 * * * *" # hourly, offset to avoid the top-of-hour rush
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch API data
        run: node scripts/fetch.mjs
      - name: Commit data if changed
        run: |
          git config user.name "taskmarket-visualizer-bot"
          git config user.email "visualizer-bot@taskmarket.dev"
          git add data/
          git diff --cached --quiet || git commit -m "data: hourly refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
